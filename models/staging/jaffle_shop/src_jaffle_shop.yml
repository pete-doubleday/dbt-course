version: 2

sources:
  - name: jaffle_shop
    database: dbt_raw
    schema: jaffle_shop
    tables:
      - name: customers
        columns:
          - name: id
            tests:
              - unique
              - not_null

      - name: orders
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after:
            count: 10
            period: day
        loaded_at_field: _etl_loaded_at
